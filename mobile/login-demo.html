<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Math App - Đăng Nhập</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(135deg, #fff9f0 0%, #fff5e6 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        max-width: 420px;
        width: 100%;
        background: #fff9f0;
        border-radius: 30px;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
      }

      .header {
        padding: 40px 24px 20px;
      }

      .back-button {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: white;
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        transition: transform 0.2s;
      }

      .back-button:hover {
        transform: scale(1.05);
      }

      .title {
        text-align: center;
        font-size: 28px;
        font-weight: 700;
        color: #1f2937;
        margin: 20px 0;
      }

      .mascot-container {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px;
        margin: 20px 0;
      }

      .mascot-bg {
        background: linear-gradient(180deg, #bae6fd 0%, #e0f2fe 100%);
        border-radius: 30px;
        padding: 40px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }

      .mascot-image {
        width: 200px;
        height: 200px;
        object-fit: contain;
      }

      .star {
        position: absolute;
        font-size: 30px;
        animation: twinkle 2s infinite;
      }

      .star-1 {
        top: 10px;
        left: 30px;
        animation-delay: 0s;
      }
      .star-2 {
        top: 40px;
        right: 50px;
        animation-delay: 0.5s;
      }
      .star-3 {
        bottom: 40px;
        left: 50px;
        animation-delay: 1s;
      }
      .star-4 {
        bottom: 10px;
        right: 30px;
        animation-delay: 1.5s;
      }

      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.3;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.2);
        }
      }

      .subtitle-container {
        text-align: center;
        padding: 0 24px 30px;
      }

      .subtitle {
        font-size: 24px;
        font-weight: 700;
        color: #1f2937;
        margin-bottom: 10px;
      }

      .description {
        font-size: 16px;
        color: #6b7280;
      }

      .form {
        padding: 0 24px 40px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .label {
        display: block;
        font-size: 16px;
        font-weight: 600;
        color: #1f2937;
        margin-bottom: 8px;
      }

      .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
        background: white;
        border-radius: 16px;
        padding: 16px 20px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        border: 1px solid #f3f4f6;
        transition: all 0.3s;
      }

      .input-wrapper:focus-within {
        border-color: #14b8a6;
        box-shadow: 0 4px 12px rgba(20, 184, 166, 0.15);
      }

      .input {
        flex: 1;
        border: none;
        outline: none;
        font-size: 16px;
        color: #1f2937;
        background: transparent;
      }

      .input::placeholder {
        color: #9ca3af;
      }

      .input-icon {
        font-size: 24px;
        margin-left: 10px;
      }

      .submit-button {
        width: 100%;
        background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
        border: none;
        border-radius: 24px;
        padding: 20px;
        font-size: 20px;
        font-weight: 700;
        color: #1f2937;
        cursor: pointer;
        margin-top: 30px;
        box-shadow: 0 8px 20px rgba(74, 222, 128, 0.3);
        transition: all 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .submit-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 28px rgba(74, 222, 128, 0.4);
      }

      .submit-button:active {
        transform: scale(0.98);
      }

      .login-link {
        text-align: center;
        margin-top: 24px;
        font-size: 16px;
        color: #6b7280;
      }

      .login-link a {
        color: #14b8a6;
        font-weight: 700;
        text-decoration: none;
      }

      .login-link a:hover {
        text-decoration: underline;
      }

      .eye-button {
        background: none;
        border: none;
        cursor: pointer;
        padding: 0;
        margin-left: 10px;
      }

      /* Tab Navigation */
      .tab-container {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-bottom: 30px;
        padding: 0 24px;
      }

      .tab {
        padding: 12px 30px;
        border-radius: 20px;
        border: none;
        background: white;
        font-size: 16px;
        font-weight: 600;
        color: #6b7280;
        cursor: pointer;
        transition: all 0.3s;
      }

      .tab.active {
        background: #14b8a6;
        color: white;
        box-shadow: 0 4px 12px rgba(20, 184, 166, 0.3);
      }

      .screen {
        display: none;
      }

      .screen.active {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Tab Navigation -->
      <div class="tab-container" style="padding-top: 30px">
        <button class="tab active" onclick="switchTab('signup')">
          Đăng Ký
        </button>
        <button class="tab" onclick="switchTab('login')">Đăng Nhập</button>
      </div>

      <!-- Signup Screen -->
      <div id="signup-screen" class="screen active">
        <div class="header">
          <button class="back-button">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#1F2937"
              stroke-width="2"
            >
              <path d="M15 18l-6-6 6-6" />
            </svg>
          </button>
        </div>

        <h1 class="title">Join the Math Adventure!</h1>

        <div class="mascot-container">
          <div class="mascot-bg">
            <img
              src="C:/Users/Administrator/.gemini/antigravity/brain/d35c2c52-4fdc-4c7c-b7c1-6420dcc4d10d/math_owl_mascot_1768906707942.png"
              alt="Math Owl Mascot"
              class="mascot-image"
            />
          </div>
          <span class="star star-1">✨</span>
          <span class="star star-2">⭐</span>
          <span class="star star-3">✨</span>
          <span class="star star-4">⭐</span>
        </div>

        <div class="subtitle-container">
          <h2 class="subtitle">Become a Math Hero</h2>
          <p class="description">Perfect for grades 1-5. Let's start!</p>
        </div>

        <div class="form">
          <div class="form-group">
            <label class="label">Child's Name</label>
            <div class="input-wrapper">
              <input type="text" class="input" placeholder="e.g., Alex" />
              <span class="input-icon">😊</span>
            </div>
          </div>

          <div class="form-group">
            <label class="label">Parent's Email</label>
            <div class="input-wrapper">
              <input
                type="email"
                class="input"
                placeholder="For progress reports"
              />
              <span class="input-icon">📧</span>
            </div>
          </div>

          <div class="form-group">
            <label class="label">Choose a Password</label>
            <div class="input-wrapper">
              <input
                type="password"
                id="signup-password"
                class="input"
                placeholder="Make it strong!"
              />
              <button
                class="eye-button"
                onclick="togglePassword('signup-password', this)"
              >
                <span class="input-icon">👁️</span>
              </button>
            </div>
          </div>

          <button class="submit-button">
            <span>Let's Go!</span>
            <span>🚀</span>
          </button>

          <p class="login-link">
            Already have an account?
            <a
              href="#"
              onclick="
                switchTab('login');
                return false;
              "
              >Log In</a
            >
          </p>
        </div>
      </div>

      <!-- Login Screen -->
      <div id="login-screen" class="screen">
        <div class="header">
          <button class="back-button">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#1F2937"
              stroke-width="2"
            >
              <path d="M15 18l-6-6 6-6" />
            </svg>
          </button>
        </div>

        <h1 class="title">Welcome Back!</h1>

        <div class="mascot-container">
          <div class="mascot-bg">
            <img
              src="C:/Users/Administrator/.gemini/antigravity/brain/d35c2c52-4fdc-4c7c-b7c1-6420dcc4d10d/math_owl_mascot_1768906707942.png"
              alt="Math Owl Mascot"
              class="mascot-image"
            />
          </div>
          <span class="star star-1">⭐</span>
          <span class="star star-2">✨</span>
          <span class="star star-3">⭐</span>
          <span class="star star-4">✨</span>
        </div>

        <div class="subtitle-container">
          <h2 class="subtitle">Continue Your Math Journey</h2>
          <p class="description">Log in to pick up where you left off!</p>
        </div>

        <div class="form">
          <div class="form-group">
            <label class="label">Parent's Email</label>
            <div class="input-wrapper">
              <input
                type="email"
                class="input"
                placeholder="Enter your email"
              />
              <span class="input-icon">📧</span>
            </div>
          </div>

          <div class="form-group">
            <label class="label">Password</label>
            <div class="input-wrapper">
              <input
                type="password"
                id="login-password"
                class="input"
                placeholder="Enter your password"
              />
              <button
                class="eye-button"
                onclick="togglePassword('login-password', this)"
              >
                <span class="input-icon">👁️</span>
              </button>
            </div>
          </div>

          <div style="text-align: right; margin-top: 8px">
            <a
              href="#"
              style="
                color: #14b8a6;
                font-size: 14px;
                font-weight: 600;
                text-decoration: none;
              "
              >Forgot Password?</a
            >
          </div>

          <button class="submit-button">
            <span>Log In</span>
            <span>🎯</span>
          </button>

          <p class="login-link">
            Don't have an account?
            <a
              href="#"
              onclick="
                switchTab('signup');
                return false;
              "
              >Sign Up</a
            >
          </p>
        </div>
      </div>
    </div>

    <script>
      function switchTab(tab) {
        // Update tabs
        const tabs = document.querySelectorAll(".tab");
        tabs.forEach((t) => t.classList.remove("active"));
        event.target.classList.add("active");

        // Update screens
        const screens = document.querySelectorAll(".screen");
        screens.forEach((s) => s.classList.remove("active"));
        document.getElementById(tab + "-screen").classList.add("active");
      }

      function togglePassword(inputId, button) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
          input.type = "text";
          button.querySelector(".input-icon").textContent = "👁️‍🗨️";
        } else {
          input.type = "password";
          button.querySelector(".input-icon").textContent = "👁️";
        }
      }
    </script>
  </body>
</html>
